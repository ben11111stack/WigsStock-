name = "wigsstock-sync"
main = "src/worker.js"
compatibility_date = "2024-11-01"
# Account id is an identifier (not a credential); lets CI deploy with only the
# API token in a GitHub Secret. See .github/workflows/deploy-worker.yml.
account_id = "7c5259865ad06b1a05dbff3e55d53027"

# backstop auto-write (real writes fire within ~5s of a scan via /api/sync)
[triggers]
crons = ["* * * * *"]

# Fill database_id after: npx wrangler d1 create wigsstock
[[d1_databases]]
binding = "DB"
database_name = "wigsstock"
database_id = "25c4cb65-108a-4295-8090-5c2dc9c787ec"
