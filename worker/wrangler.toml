name = "wigsstock-sync"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# backstop auto-write (real writes fire within ~5s of a scan via /api/sync)
[triggers]
crons = ["* * * * *"]

# Fill database_id after: npx wrangler d1 create wigsstock
[[d1_databases]]
binding = "DB"
database_name = "wigsstock"
database_id = "25c4cb65-108a-4295-8090-5c2dc9c787ec"
