name: Cloudflare live D1 audit

on:
  push:
    branches: [claude/inventory-barcode-scanner-4w4fbf]
    paths: ['.github/workflows/cloudflare-live-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current D1 usage
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CF_ACCOUNT: "7c5259865ad06b1a05dbff3e55d53027"
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN, account=process.env.CF_ACCOUNT;
          if(!token) throw new Error('missing token');
          const q=`query($accountTag: string!, $start: Date, $end: Date) {
            viewer { accounts(filter:{accountTag:$accountTag}) {
              d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$start,date_leq:$end}) {
                sum { rowsRead rowsWritten readQueries writeQueries }
                dimensions { date databaseId }
              }
            }}
          }`;
          const now=new Date(), day=now.toISOString().slice(0,10);
          const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({query:q,variables:{accountTag:account,start:day,end:day}})
          });
          const j=await r.json();
          if(!r.ok||j.errors) throw new Error(JSON.stringify(j.errors||j).slice(0,1000));
          const groups=j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[];
          const names={
            '25c4cb65-108a-4295-8090-5c2dc9c787ec':'wigsstock',
            'f80509c6-6e4a-4a87-8c1a-b07ee75a0390':'abba-care'
          };
          const sums={};
          for(const g of groups){
            const id=g.dimensions.databaseId;
            const x=sums[id]||{rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0};
            for(const k of Object.keys(x)) x[k]+=Number(g.sum?.[k]||0);
            sums[id]=x;
          }
          console.log('AUDIT_AT_UTC='+now.toISOString());
          for(const [id,x] of Object.entries(sums)) console.log((names[id]||id)+' '+JSON.stringify(x));
          console.log('TOTAL_ROWS_READ='+Object.values(sums).reduce((n,x)=>n+x.rowsRead,0));
          NODE
