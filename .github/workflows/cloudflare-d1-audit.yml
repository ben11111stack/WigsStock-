name: Cloudflare D1 usage audit

on:
  push:
    branches: [claude/inventory-barcode-scanner-4w4fbf]
    paths:
      - '.github/workflows/cloudflare-d1-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/inventory-barcode-scanner-4w4fbf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit D1 rows read by database
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CF_ACCOUNT: "7c5259865ad06b1a05dbff3e55d53027"
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const report = {
            generated_at:new Date().toISOString(),
            account:process.env.CF_ACCOUNT || null,
            databases:[],
            usage_today_utc:[],
            account_total_rows_read:0
          };
          try {
            const token = process.env.CF_TOKEN;
            const account = process.env.CF_ACCOUNT;
            if (!token) throw new Error('No Cloudflare token is available in repository secrets.');
            const headers = {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json'};
            async function json(url, init={}) {
              const r = await fetch(url, {...init, headers:{...headers,...(init.headers||{})}});
              const body = await r.json().catch(()=>null);
              if (!r.ok || body?.success === false) {
                const err = new Error('Cloudflare request failed ('+r.status+')');
                err.details = body?.errors || body;
                throw err;
              }
              return body;
            }
            const dbResp = await json('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database?per_page=100');
            const dbs = Array.isArray(dbResp.result) ? dbResp.result : [];
            report.databases = dbs.map(d=>({name:d.name,uuid:d.uuid,created_at:d.created_at||null}));

            const now = new Date();
            const start = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const end = new Date(start.getTime()+86400000-1);
            const ds = d => d.toISOString().slice(0,10);
            const query = `query D1Usage($accountTag: string!, $start: Date, $end: Date) {
              viewer {
                accounts(filter: { accountTag: $accountTag }) {
                  d1AnalyticsAdaptiveGroups(
                    limit: 10000
                    filter: { date_geq: $start, date_leq: $end }
                  ) {
                    sum { rowsRead rowsWritten readQueries writeQueries }
                    dimensions { date databaseId }
                  }
                }
              }
            }`;
            try {
              const gql = await json('https://api.cloudflare.com/client/v4/graphql', {
                method:'POST',
                body:JSON.stringify({query, variables:{accountTag:account,start:ds(start),end:ds(end)}})
              });
              const groups = gql?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups || [];
              const byId = new Map(dbs.map(d=>[d.uuid,d.name]));
              const sums = new Map();
              for (const g of groups) {
                const id = g.dimensions?.databaseId || 'unknown';
                const x = sums.get(id) || {rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0};
                for (const k of Object.keys(x)) x[k] += Number(g.sum?.[k]||0);
                sums.set(id,x);
              }
              report.usage_today_utc = [...sums.entries()].map(([databaseId,x])=>({
                databaseId, database:byId.get(databaseId)||null, ...x
              })).sort((a,b)=>b.rowsRead-a.rowsRead);
              report.account_total_rows_read = report.usage_today_utc.reduce((n,x)=>n+x.rowsRead,0);
            } catch (e) {
              report.graphql_error = e.message;
              report.graphql_details = e.details || null;
            }
          } catch (e) {
            report.audit_error = e.message;
            report.audit_details = e.details || null;
          }
          fs.writeFileSync('cloudflare-d1-audit-result.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Top WigsStock queries by rows read
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c5259865ad06b1a05dbff3e55d53027"
        shell: bash
        run: |
          set +e
          npx wrangler@latest d1 insights wigsstock --sort-type=sum --sort-by=reads --limit=15 --timePeriod=1d --json > ../cloudflare-d1-wigsstock-insights.txt 2>&1
          code=$?
          echo "exit_code=$code" >> ../cloudflare-d1-wigsstock-insights.txt
          exit 0

      - name: Save sanitized audit results to the repo
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-d1-audit-result.json cloudflare-d1-wigsstock-insights.txt
          if git diff --cached --quiet; then
            echo "No audit result changes."
          else
            git commit -m "Record Cloudflare D1 usage audit"
            git pull --rebase origin claude/inventory-barcode-scanner-4w4fbf
            git push origin HEAD:claude/inventory-barcode-scanner-4w4fbf
          fi
