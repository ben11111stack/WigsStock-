name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logic tests
        run: node tests/run.js

      - name: Verify single-file build is up to date
        run: |
          node build-single.js
          if ! git diff --quiet -- wigsstock-app.html; then
            echo "::error::wigsstock-app.html is stale — run 'node build-single.js' and commit the result."
            git --no-pager diff --stat -- wigsstock-app.html
            exit 1
          fi
